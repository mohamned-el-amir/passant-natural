<title>Passant Natural</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Arial,sans-serif;background:linear-gradient(145deg,#f4f0e7,#e7eee2);color:#243126;display:flex;justify-content:center}
.page{width:100%;max-width:480px;padding:42px 22px 35px;text-align:center}
.logo{width:92px;height:92px;border-radius:50%;margin:auto;background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 28px #31452a20;font-size:39px}
h1{margin:18px 0 7px;font-size:31px;letter-spacing:.3px}
.tag{margin:0 0 28px;color:#65735f;font-size:15px}
.links{display:grid;gap:13px}
a{display:flex;align-items:center;justify-content:center;gap:12px;text-decoration:none;color:#263226;background:#fff;padding:16px 18px;border-radius:16px;font-weight:700;box-shadow:0 6px 20px #31452a12;transition:.2s}
a:hover{transform:translateY(-2px)}
.icon{font-size:21px;width:25px}
.contact{margin-top:26px;background:#ffffffb8;border:1px solid #ffffff;padding:18px;border-radius:18px}
.contact p{margin:9px 0;font-size:14px}
.contact a{display:inline;padding:0;background:none;box-shadow:none;color:#4f7049}
footer{margin-top:25px;font-size:12px;color:#788273}
</style>
</head>
